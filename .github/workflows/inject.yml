name: Inject & Build IPA

on:
  push:
    paths:
      - '**.ipa'
  workflow_dispatch:
  repository_dispatch:
    types: [dylib-updated]

jobs:
  inject:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download latest dylib
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GH_PAT }}
          repo: 9xhk-1/ios-active-dylib
          branch: main
          workflow: build.yml
          name: ActiveDylib
          path: dylib/

      - name: Find IPA
        id: find-ipa
        run: |
          IPA=$(find . -name '*.ipa' -not -path './output/*' | head -1)
          echo "ipa=$IPA" >> $GITHUB_OUTPUT
          echo "Found IPA: $IPA"

      - name: Setup
        run: brew install ldid

      - name: Cache insert_dylib
        id: cache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/insert_dylib
          key: id-v1

      - name: Build insert_dylib
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/Tyilo/insert_dylib.git /tmp/id
          cd /tmp/id
          xcodebuild -project insert_dylib.xcodeproj -target insert_dylib -configuration Release -sdk macosx CONFIGURATION_BUILD_DIR=/tmp/id_build -quiet
          sudo cp /tmp/id_build/insert_dylib /usr/local/bin/

      - name: Inject into IPA
        run: |
          set -e
          IPA="${{ steps.find-ipa.outputs.ipa }}"
          DYLIB=$(find dylib/ -name '*.dylib' -type f | head -1)
          NAME=$(basename "$IPA" .ipa)

          rm -rf work output
          mkdir -p work output

          bsdtar -xf "$IPA" -C work/ 2>/dev/null || unzip -o "$IPA" -d work/
          test -d work/Payload || { echo "Payload not found, listing work:"; find work -maxdepth 2 -ls; exit 1; }

          APP=$(find work/Payload -name '*.app' -maxdepth 1 -type d | head -1)
          APP_NAME=$(basename "$APP" .app)
          BIN="$APP/$APP_NAME"
          echo "App: $APP_NAME"

          mkdir -p "$APP/Frameworks"
          cp "$DYLIB" "$APP/Frameworks/"
          insert_dylib "@executable_path/Frameworks/ActiveDylib.dylib" "$BIN" --inplace
          ldid -S "$BIN"
          ldid -S "$APP/Frameworks/ActiveDylib.dylib"
          rm -rf "$APP/_CodeSignature"

          cd work
          zip -r "../output/${NAME}-injected.ipa" Payload/
          cd ..
          ls -lh "output/${NAME}-injected.ipa"

      - name: Upload injected IPA
        uses: actions/upload-artifact@v4
        with:
          name: injected-ipa
          path: output/*-injected.ipa
