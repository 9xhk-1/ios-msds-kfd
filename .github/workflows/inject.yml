name: Inject & Build IPA

on:
  push:
    paths:
      - '**.ipa'
  workflow_dispatch:
  repository_dispatch:
    types: [dylib-updated]

jobs:
  inject:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download latest dylib
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GH_PAT }}
          repo: 9xhk-1/ios-active-dylib
          branch: main
          workflow: build.yml
          name: ActiveDylib
          path: dylib/

      - name: Find IPA
        id: find-ipa
        run: |
          IPA=$(find . -name '*.ipa' -not -path './output/*' | head -1)
          echo "ipa=$IPA" >> $GITHUB_OUTPUT
          echo "Found IPA: $IPA"

      - name: Setup
        run: |
          brew install ldid
          clang -O2 tools/main.c -o /usr/local/bin/insert_dylib

      - name: Inject into IPA
        run: |
          set -e
          IPA="${{ steps.find-ipa.outputs.ipa }}"
          DYLIB=$(find dylib/ -name '*.dylib' -type f | head -1)
          NAME=$(basename "$IPA" .ipa)

          rm -rf work output
          mkdir -p work output

          bsdtar -xf "$IPA" -C work/ 2>/dev/null || unzip -o "$IPA" -d work/
          test -d work/Payload || { echo "ERROR: Payload not found"; find work -maxdepth 2 -ls; exit 1; }

          APP=$(find work/Payload -name '*.app' -maxdepth 1 -type d | head -1)
          APP_NAME=$(basename "$APP" .app)
          BIN="$APP/$APP_NAME"

          mkdir -p "$APP/Frameworks"
          cp "$DYLIB" "$APP/Frameworks/"

          # extract original entitlements
          ldid -e "$BIN" > /tmp/ent.xml 2>/dev/null || echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict/></plist>' > /tmp/ent.xml

          insert_dylib "@executable_path/Frameworks/ActiveDylib.dylib" "$BIN" --all-yes --inplace
          ldid -S/tmp/ent.xml "$BIN"
          ldid -S "$APP/Frameworks/ActiveDylib.dylib"
          rm -rf "$APP/_CodeSignature"

          cd work
          zip -r "../output/${NAME}-injected.ipa" Payload/
          cd ..
          ls -lh "output/${NAME}-injected.ipa"

      - name: Upload injected IPA
        uses: actions/upload-artifact@v4
        with:
          name: injected-ipa
          path: output/*-injected.ipa
