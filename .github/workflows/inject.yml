name: Inject & Build IPA

on:
  push:
    paths:
      - '**.ipa'
  workflow_dispatch:
  repository_dispatch:
    types: [dylib-updated]

jobs:
  inject:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download latest dylib
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GH_PAT }}
          repo: 9xhk-1/ios-active-dylib
          branch: main
          workflow: build.yml
          name: ActiveDylib
          path: dylib/

      - name: Find IPA
        id: find-ipa
        run: |
          IPA=$(find . -name '*.ipa' -not -path './output/*' | head -1)
          echo "ipa=$IPA" >> $GITHUB_OUTPUT
          echo "Found IPA: $IPA"

      - name: Install tools
        run: |
          brew install ldid
          git clone --recurse-submodules --depth 1 https://github.com/Tyilo/insert_dylib.git /tmp/id
          cd /tmp/id/insert_dylib
          clang -O2 main.c -o insert_dylib -I.
          sudo cp insert_dylib /usr/local/bin/

      - name: Inject into IPA
        run: |
          set -e
          IPA="${{ steps.find-ipa.outputs.ipa }}"
          DYLIB=$(find dylib/ -name '*.dylib' -type f | head -1)
          NAME=$(basename "$IPA" .ipa)
          echo "IPA: $IPA"
          echo "DYLIB: $DYLIB"

          rm -rf work output
          mkdir -p work output

          # extract IPA via Python (handles Windows-created zip paths)
          python3 -c "
          import zipfile, os
          out = os.path.abspath('work')
          os.makedirs(out, exist_ok=True)
          zf = zipfile.ZipFile('$IPA', 'r')
          for info in zf.infolist():
              fname = info.filename.replace('\\\\', '/')
              parts = fname.split('/')
              try:
                  idx = parts.index('Payload')
                  rel = '/'.join(parts[idx:])
              except ValueError:
                  continue
              if '..' in rel: continue
              target = os.path.normpath(os.path.join(out, rel))
              os.makedirs(os.path.dirname(target), exist_ok=True)
              if not info.is_dir():
                  with zf.open(info) as src, open(target, 'wb') as dst:
                      dst.write(src.read())
          zf.close()
          print('Extracted OK')
          "

          # find binary
          APP=$(find work/Payload -name '*.app' -maxdepth 1 -type d | head -1)
          APP_NAME=$(basename "$APP" .app)
          BIN="$APP/$APP_NAME"
          echo "App: $APP_NAME"
          echo "Bin: $BIN"

          # copy dylib into Frameworks, inject with @executable_path
          mkdir -p "$APP/Frameworks"
          cp "$DYLIB" "$APP/Frameworks/"
          insert_dylib "@executable_path/Frameworks/ActiveDylib.dylib" "$BIN" --inplace
          ldid -S "$BIN"
          ldid -S "$APP/Frameworks/ActiveDylib.dylib"
          rm -rf "$APP/_CodeSignature"

          # repack
          cd work
          python3 -c "
          import zipfile, os
          zf = zipfile.ZipFile('../output/${NAME}-injected.ipa', 'w', zipfile.ZIP_DEFLATED)
          for root, dirs, files in os.walk('.'):
              for name in dirs + files:
                  full = os.path.join(root, name)
                  arc = full.replace(os.sep, '/')
                  if arc.startswith('./'): arc = arc[2:]
                  zf.write(full, arc)
          zf.close()
          print('Repacked OK')
          "
          cd ..
          ls -lh "output/${NAME}-injected.ipa"

      - name: Upload injected IPA
        uses: actions/upload-artifact@v4
        with:
          name: injected-ipa
          path: output/*-injected.ipa
