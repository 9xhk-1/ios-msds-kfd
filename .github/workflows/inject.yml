name: Inject & Build IPA

on:
  push:
    paths:
      - '**.ipa'
  workflow_dispatch:
  repository_dispatch:
    types: [dylib-updated]

jobs:
  inject:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download latest dylib
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GH_PAT }}
          repo: 9xhk-1/ios-active-dylib
          branch: main
          workflow: build.yml
          name: ActiveDylib
          path: dylib/

      - name: Find IPA
        id: find-ipa
        run: |
          IPA=$(find . -name '*.ipa' -not -path './output/*' | head -1)
          echo "ipa=$IPA" >> $GITHUB_OUTPUT
          echo "Found IPA: $IPA"

      - name: Install ldid
        run: brew install ldid

      - name: Build injector
        run: |
          cat > /tmp/inject.c << 'CEOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <mach-o/loader.h>
          #include <mach-o/fat.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/stat.h>

          int main(int argc, char **argv) {
              if (argc != 3) { fprintf(stderr, "Usage: inject <dylib_path> <binary>\n"); return 1; }
              const char *dylib = argv[1];
              char *binpath = argv[2];
              size_t dylib_len = strlen(dylib) + 1;

              int fd = open(binpath, O_RDWR);
              if (fd < 0) { perror("open"); return 1; }
              struct stat st; fstat(fd, &st);
              uint8_t *data = mmap(NULL, st.st_size, PROT_READ|PROT_WRITE, MAP_SHARED, fd, 0);
              if (data == MAP_FAILED) { perror("mmap"); return 1; }

              uint32_t magic = *(uint32_t*)data, offset = 0;
              if (magic == FAT_MAGIC || magic == FAT_CIGAM) {
                  struct fat_header *fh = (void*)data;
                  uint32_t nfat = OSSwapBigToHostInt32(fh->nfat_arch);
                  struct fat_arch *fa = (void*)(data + sizeof(struct fat_header));
                  int found = 0;
                  for (uint32_t i = 0; i < nfat; i++) {
                      if (OSSwapBigToHostInt32(fa[i].cputype) == CPU_TYPE_ARM64) {
                          offset = OSSwapBigToHostInt32(fa[i].offset); found = 1; break;
                      }
                  }
                  if (!found) { fprintf(stderr, "no arm64 slice\n"); return 1; }
              }

              struct mach_header_64 *mh = (void*)(data + offset);
              if (mh->magic != MH_MAGIC_64) { fprintf(stderr, "not arm64\n"); return 1; }

    uint32_t ncmds = mh->ncmds;
    uint32_t sizeofcmds = mh->sizeofcmds;
    uint8_t *readpos = (void*)(data + offset + sizeof(struct mach_header_64));
    uint8_t *writepos = readpos;

    // remove LC_CODE_SIGNATURE
    uint32_t new_ncmds = ncmds;
    for (uint32_t i = 0; i < ncmds; i++) {
        struct load_command *lc = (void*)readpos;
        if (lc->cmd == LC_CODE_SIGNATURE) {
            new_ncmds--;
        } else {
            if (writepos != readpos) memmove(writepos, lc, lc->cmdsize);
            writepos += lc->cmdsize;
        }
        readpos += lc->cmdsize;
    }

    // calc new sizes
    uint32_t new_sz = (uint32_t)(writepos - (data + offset + sizeof(struct mach_header_64)));

              // add LC_LOAD_DYLIB
              uint32_t dylib_cmd_sz = sizeof(struct dylib_command) + dylib_len;
              dylib_cmd_sz = (dylib_cmd_sz + 7) & ~7;
    struct dylib_command *dc = (void*)writepos;
    dc->cmd = LC_LOAD_DYLIB;
    dc->cmdsize = dylib_cmd_sz;
    dc->dylib.name.offset = sizeof(struct dylib_command);
    dc->dylib.timestamp = 2;
    dc->dylib.current_version = 0;
    dc->dylib.compatibility_version = 0;
    memcpy(writepos + sizeof(struct dylib_command), dylib, dylib_len);
    new_ncmds++;
    new_sz += dylib_cmd_sz;

              mh->ncmds = new_ncmds;
              mh->sizeofcmds = new_sz;

              munmap(data, st.st_size);
              close(fd);
              return 0;
          }
          CEOF
          clang -O2 /tmp/inject.c -o /usr/local/bin/inject

      - name: Inject dylib into IPA
        run: |
          set -e
          IPA="${{ steps.find-ipa.outputs.ipa }}"
          DYLIB=$(find dylib/ -name '*.dylib' -type f | head -1)
          NAME=$(basename "$IPA" .ipa)

          rm -rf work output
          mkdir -p work output

          python3 -c "
          import zipfile, os
          out = os.path.abspath('work')
          os.makedirs(out, exist_ok=True)
          zf = zipfile.ZipFile('$IPA', 'r')
          for info in zf.infolist():
              fname = info.filename.replace('\\\\', '/')
              parts = fname.split('/')
              try:
                  idx = parts.index('Payload')
                  rel = '/'.join(parts[idx:])
              except ValueError:
                  continue
              if '..' in rel: continue
              target = os.path.normpath(os.path.join(out, rel))
              os.makedirs(os.path.dirname(target), exist_ok=True)
              if not info.is_dir():
                  with zf.open(info) as src, open(target, 'wb') as dst:
                      dst.write(src.read())
          zf.close()
          print('Extracted OK')
          "

          APP=$(find work/Payload -name '*.app' -maxdepth 1 -type d | head -1)
          APP_NAME=$(basename "$APP" .app)
          BIN="$APP/$APP_NAME"
          echo "App: $APP_NAME"

          mkdir -p "$APP/Frameworks"
          cp "$DYLIB" "$APP/Frameworks/"
          inject "@executable_path/Frameworks/ActiveDylib.dylib" "$BIN"
          ldid -S "$BIN"
          ldid -S "$APP/Frameworks/ActiveDylib.dylib"
          rm -rf "$APP/_CodeSignature"

          cd work
          python3 -c "
          import zipfile, os
          zf = zipfile.ZipFile('../output/${NAME}-injected.ipa', 'w', zipfile.ZIP_DEFLATED)
          for root, dirs, files in os.walk('.'):
              for name in dirs + files:
                  full = os.path.join(root, name)
                  arc = full.replace(os.sep, '/')
                  if arc.startswith('./'): arc = arc[2:]
                  zf.write(full, arc)
          zf.close()
          print('Repacked OK')
          "
          cd ..
          ls -lh "output/${NAME}-injected.ipa"

      - name: Upload injected IPA
        uses: actions/upload-artifact@v4
        with:
          name: injected-ipa
          path: output/*-injected.ipa
