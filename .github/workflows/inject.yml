name: Inject & Build IPA

on:
  push:
    paths:
      - '**.ipa'
  workflow_dispatch:
  repository_dispatch:
    types: [dylib-updated]

jobs:
  inject:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download latest dylib
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GH_PAT }}
          repo: 9xhk-1/ios-active-dylib
          branch: main
          workflow: build.yml
          name: ActiveDylib
          path: dylib/

      - name: Find IPA
        id: find-ipa
        run: |
          IPA=$(find . -name '*.ipa' -not -path './output/*' | head -1)
          echo "ipa=$IPA" >> $GITHUB_OUTPUT
          echo "Found IPA: $IPA"

      - name: Install insert_dylib
        run: |
          brew install ldid
          git clone https://github.com/Tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -target insert_dylib -configuration Release -sdk macosx CONFIGURATION_BUILD_DIR=/tmp/id_build
          sudo cp /tmp/id_build/insert_dylib /usr/local/bin/

      - name: Inject dylib into IPA
        run: |
          set -e
          IPA="${{ steps.find-ipa.outputs.ipa }}"
          DYLIB=$(find dylib/ -name '*.dylib' -type f | head -1)
          NAME=$(basename "$IPA" .ipa)
          echo "IPA: $IPA"
          echo "DYLIB: $DYLIB"
          echo "NAME: $NAME"

          rm -rf work output
          mkdir -p work output

          python3 -c "
          import zipfile, os
          out = os.path.abspath('work')
          os.makedirs(out, exist_ok=True)
          zf = zipfile.ZipFile('$IPA', 'r')
          for info in zf.infolist():
              target = os.path.join(out, info.filename.replace('\\\\', '/'))
              if target.startswith('/') or '..' in target:
                  print('SKIP suspicious:', target)
                  continue
              os.makedirs(os.path.dirname(target), exist_ok=True)
              if not target.endswith('/'):
                  with zf.open(info) as src, open(target, 'wb') as dst:
                      dst.write(src.read())
          zf.close()
          print('Extracted OK')
          "
          ls -la work/

          APP_DIR=$(find work -name 'Payload' -maxdepth 1 -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find work -name '*.app' -path '*/Payload/*' -maxdepth 3 -type d | head -1)
            APP_DIR=$(dirname "$APP_DIR")
          fi
          echo "App dir: $APP_DIR"

          BINARY=$(find "$APP_DIR" -name '*.app' -maxdepth 1 -type d | head -1)
          APP_NAME=$(basename "$BINARY" .app)
          BIN_PATH="$BINARY/$APP_NAME"
          echo "Binary: $BIN_PATH"

          insert_dylib "$DYLIB" "$BIN_PATH" --all-yes --inplace
          ldid -S "$BIN_PATH"

          rm -rf "$BINARY/_CodeSignature"

          cd work
          python3 -c "
          import zipfile, os
          zf = zipfile.ZipFile('../output/${NAME}-injected.ipa', 'w', zipfile.ZIP_DEFLATED)
          for root, dirs, files in os.walk('.'):
              for f in dirs + files:
                  full = os.path.join(root, f)
                  if full.startswith('./'): full = full[2:]
                  zf.write(full, full.replace(os.sep, '/'))
          zf.close()
          print('Repacked OK')
          "
          cd ..
          ls -lh "output/${NAME}-injected.ipa"

      - name: Upload injected IPA
        uses: actions/upload-artifact@v4
        with:
          name: injected-ipa
          path: output/*-injected.ipa
